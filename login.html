<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Executive Portal Authentication | Demo Advance Analysis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #006a4e;
  --primary-dark: #004d38;
  --primary-light: #e8f5e9;
  --accent: #10b981;
  --bg: #090d16;
  --card: rgba(17, 24, 39, 0.85);
  --border: rgba(255, 255, 255, 0.1);
  --border-focus: #10b981;
  --text: #f8fafc;
  --text-muted: #94a3b8;
  --danger: #ef4444;
  --danger-bg: rgba(239, 68, 68, 0.12);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Plus Jakarta Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  padding: 20px;
}

/* Ambient animated background glow */
.bg-glow-1 {
  position: absolute;
  width: 550px;
  height: 550px;
  background: radial-gradient(circle, rgba(0, 106, 78, 0.35) 0%, rgba(0, 0, 0, 0) 70%);
  top: -150px;
  left: -150px;
  border-radius: 50%;
  filter: blur(80px);
  z-index: 0;
  animation: floatSlow 12s ease-in-out infinite alternate;
}

.bg-glow-2 {
  position: absolute;
  width: 600px;
  height: 600px;
  background: radial-gradient(circle, rgba(16, 185, 129, 0.22) 0%, rgba(0, 0, 0, 0) 70%);
  bottom: -180px;
  right: -180px;
  border-radius: 50%;
  filter: blur(90px);
  z-index: 0;
  animation: floatSlow 14s ease-in-out infinite alternate-reverse;
}

.bg-grid {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
  background-size: 40px 40px;
  z-index: 0;
}

@keyframes floatSlow {
  0% { transform: translate(0, 0) scale(1); }
  100% { transform: translate(40px, 50px) scale(1.1); }
}

/* Auth Card */
.auth-wrapper {
  position: relative;
  z-index: 10;
  width: 100%;
  max-width: 440px;
}

.auth-card {
  background: var(--card);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 40px 36px;
  box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7),
              0 0 0 1px rgba(255, 255, 255, 0.05);
}

.brand-header {
  text-align: center;
  margin-bottom: 32px;
}

.brand-logo-badge {
  width: 64px;
  height: 64px;
  background: linear-gradient(135deg, #006a4e 0%, #10b981 100%);
  border-radius: 18px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: 'Outfit', sans-serif;
  font-size: 26px;
  font-weight: 900;
  color: #ffffff;
  box-shadow: 0 8px 24px rgba(0, 106, 78, 0.4);
  margin-bottom: 16px;
  border: 1px solid rgba(255, 255, 255, 0.2);
}

.brand-title {
  font-family: 'Outfit', sans-serif;
  font-size: 22px;
  font-weight: 800;
  color: #ffffff;
  letter-spacing: -0.5px;
}

.brand-subtitle {
  font-size: 13px;
  color: var(--text-muted);
  margin-top: 6px;
}

.security-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  font-weight: 600;
  color: #10b981;
  background: rgba(16, 185, 129, 0.1);
  padding: 4px 10px;
  border-radius: 100px;
  margin-top: 10px;
  border: 1px solid rgba(16, 185, 129, 0.2);
  letter-spacing: 0.4px;
}

/* Form */
.form-group {
  margin-bottom: 20px;
}

.form-label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: #cbd5e1;
  margin-bottom: 8px;
  text-transform: uppercase;
  letter-spacing: 0.6px;
}

.input-box {
  position: relative;
}

.input-box svg {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: #64748b;
  pointer-events: none;
  transition: color 0.2s;
}

.form-input {
  width: 100%;
  background: rgba(15, 23, 42, 0.7);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 12px;
  padding: 13px 44px 13px 42px;
  font-size: 14px;
  color: #ffffff;
  font-family: inherit;
  transition: all 0.25s ease;
  outline: none;
}

.form-input:focus {
  border-color: var(--border-focus);
  background: rgba(15, 23, 42, 0.95);
  box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.15);
}

.form-input:focus + svg {
  color: var(--accent);
}

.toggle-password {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  color: #64748b;
  cursor: pointer;
  padding: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 6px;
  transition: color 0.2s;
}

.toggle-password:hover {
  color: #cbd5e1;
}

/* Remember me & Auto Login hint */
.form-actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 24px;
  font-size: 12.5px;
}

.remember-label {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--text-muted);
  cursor: pointer;
  user-select: none;
}

.remember-label input[type="checkbox"] {
  accent-color: var(--accent);
  width: 15px;
  height: 15px;
  border-radius: 4px;
  cursor: pointer;
}

/* Submit Button */
.btn-submit {
  width: 100%;
  background: linear-gradient(135deg, #006a4e 0%, #059669 100%);
  color: #ffffff;
  border: none;
  border-radius: 12px;
  padding: 14px;
  font-size: 14.5px;
  font-weight: 700;
  font-family: 'Outfit', sans-serif;
  letter-spacing: 0.3px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  box-shadow: 0 8px 20px rgba(0, 106, 78, 0.35);
  transition: all 0.25s ease;
}

.btn-submit:hover {
  background: linear-gradient(135deg, #007a5a 0%, #10b981 100%);
  box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4);
  transform: translateY(-1px);
}

.btn-submit:active {
  transform: translateY(1px);
}

/* Error banner */
.error-banner {
  display: none;
  background: var(--danger-bg);
  border: 1px solid rgba(239, 68, 68, 0.3);
  color: #fca5a5;
  padding: 11px 14px;
  border-radius: 10px;
  font-size: 12.5px;
  margin-bottom: 20px;
  align-items: center;
  gap: 9px;
  animation: shake 0.35s ease-in-out;
}

.error-banner.show {
  display: flex;
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  75% { transform: translateX(6px); }
}

/* Success Animation */
.success-banner {
  display: none;
  background: rgba(16, 185, 129, 0.15);
  border: 1px solid rgba(16, 185, 129, 0.4);
  color: #6ee7b7;
  padding: 11px 14px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 20px;
  align-items: center;
  gap: 9px;
}

.success-banner.show {
  display: flex;
}

.footer-copy {
  text-align: center;
  margin-top: 24px;
  font-size: 11.5px;
  color: #64748b;
  letter-spacing: 0.3px;
}
</style>
</head>
<body>

<div class="bg-grid"></div>
<div class="bg-glow-1"></div>
<div class="bg-glow-2"></div>

<div class="auth-wrapper">
  <div class="auth-card">
    
    <div class="brand-header">
      <div class="brand-logo-badge">DA</div>
      <h1 class="brand-title">Demo Advance Analysis</h1>
      <p class="brand-subtitle">C-Suite Executive Commercial Intelligence Portal</p>
      <div class="security-tag">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <span>SECURE ENTERPRISE ENCLAVE</span>
      </div>
    </div>

    <div class="error-banner" id="errorBanner">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span id="errorMsg">ইমেইল অথবা পাসওয়ার্ড সঠিক নয়। পুনরায় চেষ্টা করুন।</span>
    </div>

    <div class="success-banner" id="successBanner">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
      <span>যাচাইকরণ সফল! পোর্টালে প্রবেশ করা হচ্ছে...</span>
    </div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="form-label" for="userEmail">Executive Email ID</label>
        <div class="input-box">
          <input type="email" id="userEmail" class="form-input" placeholder="name@company.com" required autocomplete="username">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="userPass">Portal Access Password</label>
        <div class="input-box">
          <input type="password" id="userPass" class="form-input" placeholder="••••••••••••" required autocomplete="current-password">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <button type="button" class="toggle-password" onclick="togglePassVisibility()" title="Show/Hide Password">
            <svg id="eyeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <div class="form-actions">
        <label class="remember-label">
          <input type="checkbox" id="rememberMe" checked>
          <span>Remember session</span>
        </label>
        <span style="font-size:11.5px;color:#64748b;">Enterprise 256-bit SSL</span>
      </div>

      <button type="submit" class="btn-submit" id="btnSubmit">
        <span>Enter Intelligence Portal</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </button>
    </form>

    <p class="footer-copy">© 2026 Demo Advance Analysis · Executive Confidential</p>

  </div>
</div>

<script>
// Authorized Credentials
const AUTH_EMAIL = "demo@sokrio.com";
const AUTH_PASS  = "demo@2026";

// If already authenticated, redirect to portal
if (sessionStorage.getItem('itl_auth') === 'true' || localStorage.getItem('itl_auth') === 'true') {
  window.location.replace('portal.html');
}

function togglePassVisibility() {
  const pInput = document.getElementById('userPass');
  const eye = document.getElementById('eyeIcon');
  if (pInput.type === 'password') {
    pInput.type = 'text';
    eye.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
  } else {
    pInput.type = 'password';
    eye.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
  }
}

function handleLogin(e) {
  e.preventDefault();
  const emailInput = document.getElementById('userEmail').value.trim();
  const passInput  = document.getElementById('userPass').value.trim();
  const remember   = document.getElementById('rememberMe').checked;
  const errBanner  = document.getElementById('errorBanner');
  const succBanner = document.getElementById('successBanner');
  const btnSubmit  = document.getElementById('btnSubmit');

  errBanner.classList.remove('show');
  succBanner.classList.remove('show');

  if (emailInput === AUTH_EMAIL && passInput === AUTH_PASS) {
    // Authentication successful
    succBanner.classList.add('show');
    btnSubmit.disabled = true;
    btnSubmit.style.opacity = '0.7';

    // Set auth tokens
    sessionStorage.setItem('itl_auth', 'true');
    sessionStorage.setItem('itl_user', emailInput);
    if (remember) {
      localStorage.setItem('itl_auth', 'true');
      localStorage.setItem('itl_user', emailInput);
    }

    setTimeout(() => {
      window.location.replace('portal.html');
    }, 600);
  } else {
    // Failed authentication
    errBanner.classList.add('show');
    const pField = document.getElementById('userPass');
    pField.value = '';
    pField.focus();
  }
}
</script>

</body>
</html>
